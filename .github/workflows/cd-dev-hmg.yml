# CD EKS monorepo (Modelo A): detect-apps → deploy-eks (um job por app).
# Consumidor fino dos templates; sem build/push/GitOps inline.
#
# ── TEMPLATE, NÃO LIGADO ──────────────────────────────────────────────────────
# Este workflow vem propositalmente incompleto: o template não tem apps, e um CD
# ativo aqui faria deploy de nada. Para habilitar no seu projeto:
#
#   1. Descomente o bloco `push:` em `on:` quando quiser deploy automático a
#      partir de `develop`.
#   2. Crie o reutilizável `.github/workflows/deploy-eks.yaml` com as roles AWS,
#      o registry e o repositório de infraestrutura do seu projeto.
#   3. Copie o bloco de exemplo `deploy-<app>` (comentado abaixo) uma vez por app
#      deployável, substituindo `<app>` e `<projeto>`.
#   4. Configure a var `AWS_ACCOUNT_ID` no repositório.
#   5. Faça o primeiro smoke por `workflow_dispatch` em `dev`, depois em `hmg`.
#
# Guia completo: docs/ci-cd/DEPLOY_APPLICATIONS.md
name: CD Dev/Hmg

on:
  # Descomente para deploy automático a partir de `develop`:
  # push:
  #   branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de deploy
        type: choice
        default: dev
        options:
          - dev
          - hmg
      app:
        description: "Path da app (ex: apps/<app>). Vazio = detectadas"
        type: string
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    if: inputs.app == ''
    uses: ./.github/workflows/detect-apps.yaml
    with:
      app_dirs: "apps"
      shared_dirs: "libs"

name: DMPF CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  dmpf:
    name: DMPF
    uses: mateusmacedo/dmpf/.github/workflows/dmpf-go-ci.yml@ddd3d0c4202879f168c7f6bfafaefadd94a3a621
    with:
      plugin-version: "1.0.0-rc.7"

name: Setup Node and pnpm
description: Setup pnpm, Node.js cache, and install dependencies; reads the GitHub Packages token from NODE_AUTH_TOKEN, which the calling workflow must set
inputs:
  node-version:
    description: Node.js version used in CI
    required: false
    default: "24"
  install:
    description: Run pnpm install --frozen-lockfile after the setup
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Credencial do GitHub Packages no .npmrc de usuário
      shell: bash
      run: |
        printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/npmrc"
        echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

    # Sem `version`: o pnpm/action-setup infere a versão do campo `packageManager`
    # do package.json (fonte única). Passar ambos causa ERR_PNPM_BAD_PM_VERSION.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

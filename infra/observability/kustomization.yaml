apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# As configurações ao lado de cada manifesto são as mesmas que o Compose de
# infra/local monta — o Kustomize exige o arquivo no diretório do kustomization.

resources:
  - otel-collector
  - prometheus
  - tempo
  - loki
  - alloy
  - grafana

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Alloy como DaemonSet: um por nó, lendo os logs dos pods daquele nó pela API
# do kubelet — sem hostPath, ao custo do RBAC de pods e pods/log.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/part-of: observability

resources:
  - rbac.yaml
  - daemonset.yaml

configMapGenerator:
  - name: alloy
    files:
      - config.alloy=alloy-kubernetes.alloy

apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
# Ler pods para descobrir os alvos e pods/log para seguir os registros: o
# mínimo que loki.source.kubernetes exige. Sem nodes/proxy — a coleta é pela
# API, e esse recurso daria leitura do kubelet de todo nó.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-logs
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy

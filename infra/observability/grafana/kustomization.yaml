apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Grafana com datasources e dashboards provisionados por ConfigMap: os mesmos
# arquivos que o Compose monta. Os endereços dos datasources são nomes de
# serviço, iguais nos dois ambientes.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: observability

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yaml
  - name: grafana-dashboards-kernel
    files:
      - dashboards/kernel/assincrono.json
      - dashboards/kernel/resiliencia.json
      - dashboards/kernel/runtime.json
  - name: grafana-dashboards-infra
    files:
      - dashboards/infra/redpanda.json
      - dashboards/infra/telemetria.json

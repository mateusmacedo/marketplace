# Datasources provisionados. Os endereços são nomes de serviço, iguais no
# Compose e no Kubernetes, então o arquivo serve aos dois sem variação.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # O exemplar leva da série ao trace que a produziu.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
        - name: correlation_id
          matcherType: label
          matcherRegex: dmpf_correlation_id
          url: '{ span.dmpf.correlation_id = "$${__value.raw}" || span.messaging.message.conversation_id = "$${__value.raw}" }'
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
        customQuery: true
        query: '{$${__tags}} | trace_id="$${__trace.traceId}" | scope_name != "github.com/mateusmacedo/dmpf/libs/backend/go/observability/audit"'
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      streamingEnabled:
        search: true

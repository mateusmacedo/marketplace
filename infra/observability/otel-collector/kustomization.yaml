apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# O Collector é o único destino que a app conhece: daqui os traces vão ao
# Tempo, as métricas ao receptor OTLP do Prometheus e os logs ao endpoint OTLP
# do Loki. A mesma configuração roda no Compose.

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/part-of: observability

resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: otel-collector
    files:
      - config.yaml=otel-collector.yaml

# Loki em binário único, índice TSDB e chunks no sistema de arquivos: o
# suficiente para desenvolvimento e homologação. Em produção o object store é
# externo (S3/GCS) e o schema fica igual.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # structured metadata é onde o trace_id de cada registro chega sem virar
  # label (cardinalidade), e é o que liga log a trace no Grafana.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h
  reject_old_samples: false

frontend_worker:
  grpc_client_config:
    max_recv_msg_size: 16777216
    max_send_msg_size: 16777216

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

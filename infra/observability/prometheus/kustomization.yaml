apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prometheus com os dois receptores ligados por flag: OTLP nativo (métricas do
# kernel, via Collector) e remote write (séries derivadas de spans, do Tempo).

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/part-of: observability

resources:
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  - name: prometheus
    files:
      - prometheus.yaml

# Gerado por tools/dmpf-conformance/cmd/infrasync a partir de apps/backend/*/deploy/infra.json; não edite.
# Provisionamento da topologia de referência (ADR-044, ADR-052, ADR-053): banco e
# role de cada app no postgres-init, usuários, tópicos e ACLs no redpanda-init.
services:
  postgres-init:
    image: postgres:16-alpine
    profiles: [dmpf, provisioning]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: postgres
      IAM_PG_PASSWORD: ${IAM_PG_PASSWORD:-iam-local}
      IAM_PG_MIGRATOR_PASSWORD: ${IAM_PG_MIGRATOR_PASSWORD:-iam-migrator-local}
      TENANCY_PG_PASSWORD: ${TENANCY_PG_PASSWORD:-tenancy-local}
      TENANCY_PG_MIGRATOR_PASSWORD: ${TENANCY_PG_MIGRATOR_PASSWORD:-tenancy-migrator-local}
    entrypoint: ['/bin/sh', '-c']
    # Idempotente, e reconcilia as senhas a cada execução para que trocá-las com
    # o volume mantido não deixe a app sem conexão. Com database.migrator
    # (ADR-063), o banco pertence a <app>_migrator, e a role <app> não tem posse.
    command:
      - >-
        set -e;
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'iam_migrator'" | grep -q 1; then
        psql -c "CREATE ROLE \"iam_migrator\" LOGIN"; fi;
        printf '%s\n' '\getenv pass IAM_PG_MIGRATOR_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
        "ALTER ROLE :\"role\" PASSWORD :'pass' LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=iam_migrator;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'iam'" | grep -q 1; then
        psql -c "CREATE DATABASE \"iam\" OWNER \"iam_migrator\""; fi;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'iam' AND pg_get_userbyid(datdba) = 'iam_migrator'" | grep -q 1; then
        psql -c "ALTER DATABASE \"iam\" OWNER TO \"iam_migrator\""; fi;
        psql -d "iam" -c "GRANT CREATE ON SCHEMA public TO \"iam_migrator\"";
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'iam'" | grep -q 1; then
        psql -c "CREATE ROLE \"iam\" LOGIN"; fi;
        printf '%s\n' '\getenv pass IAM_PG_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
        "ALTER ROLE :\"role\" PASSWORD :'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=iam;
        psql -c "GRANT CONNECT ON DATABASE \"iam\" TO \"iam\"";
        psql -c "REVOKE CONNECT ON DATABASE \"iam\" FROM PUBLIC";
        psql -c "REVOKE TEMPORARY ON DATABASE \"iam\" FROM PUBLIC";
        psql -d "iam" -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC";
        psql -d "iam" -c "REVOKE CREATE ON SCHEMA public FROM \"iam\"";
        psql -d "iam" -c "GRANT USAGE ON SCHEMA public TO \"iam\"";
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'tenancy_migrator'" | grep -q 1; then
        psql -c "CREATE ROLE \"tenancy_migrator\" LOGIN"; fi;
        printf '%s\n' '\getenv pass TENANCY_PG_MIGRATOR_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
        "ALTER ROLE :\"role\" PASSWORD :'pass' LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=tenancy_migrator;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'tenancy'" | grep -q 1; then
        psql -c "CREATE DATABASE \"tenancy\" OWNER \"tenancy_migrator\""; fi;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'tenancy' AND pg_get_userbyid(datdba) = 'tenancy_migrator'" | grep -q 1; then
        psql -c "ALTER DATABASE \"tenancy\" OWNER TO \"tenancy_migrator\""; fi;
        psql -d "tenancy" -c "GRANT CREATE ON SCHEMA public TO \"tenancy_migrator\"";
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'tenancy'" | grep -q 1; then
        psql -c "CREATE ROLE \"tenancy\" LOGIN"; fi;
        printf '%s\n' '\getenv pass TENANCY_PG_PASSWORD' 'SET log_min_error_statement = panic;' 'SET log_statement = none;'
        "ALTER ROLE :\"role\" PASSWORD :'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;" | psql -v ON_ERROR_STOP=1 -v role=tenancy;
        psql -c "GRANT CONNECT ON DATABASE \"tenancy\" TO \"tenancy\"";
        psql -c "REVOKE CONNECT ON DATABASE \"tenancy\" FROM PUBLIC";
        psql -c "REVOKE TEMPORARY ON DATABASE \"tenancy\" FROM PUBLIC";
        psql -d "tenancy" -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC";
        psql -d "tenancy" -c "REVOKE CREATE ON SCHEMA public FROM \"tenancy\"";
        psql -d "tenancy" -c "GRANT USAGE ON SCHEMA public TO \"tenancy\""
    deploy:
      resources:
        limits: { cpus: '0.05', memory: 32M }
        reservations: { cpus: '0.01', memory: 16M }

  redpanda-init:
    image: redpandadata/redpanda:v26.2.2
    profiles: [dmpf, provisioning]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      RPK_USER: console
      RPK_PASS: ${KAFKA_CONSOLE_PASSWORD:-console-local}
      RPK_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_IAM_PASSWORD: ${KAFKA_IAM_PASSWORD:-iam-local}
      KAFKA_TENANCY_PASSWORD: ${KAFKA_TENANCY_PASSWORD:-tenancy-local}
      KAFKA_CONSOLE_PASSWORD: ${KAFKA_CONSOLE_PASSWORD:-console-local}
    entrypoint: ['/bin/sh', '-c']
    # A ligação entre principal e source que o consumer admite é a ACL (ADR-052):
    # cada processo só escreve no próprio tópico e na DLQ que alimenta, e só quem
    # consome lê o tópico de outra app. A autorização liga por último, com as ACLs
    # já gravadas; o superusuário vazio é o principal do listener externo. Criar
    # usuário e tópico tolera o "já existe", mas a presença de cada um é conferida
    # antes das ACLs: qualquer falha interrompe o init sem ligar a autorização.
    command:
      - |
        set -eu
        admin="-X admin.hosts=redpanda:9644"
        broker="-X brokers=redpanda:29092"
        users=http://redpanda:9644/v1/security/users
        scram() {
          printf '{"username":"%s","password":"%s","algorithm":"SCRAM-SHA-256"}' "$$2" "$$3" |
            curl -sS -o /dev/null -w '%{http_code}' -X "$$1" -H 'Content-Type: application/json' --data-binary @- "$$4"
        }
        create_user() {
          case $$2 in
            *[[:cntrl:]]*) echo "redpanda-init: a senha do usuário $$1 tem caractere de controle" >&2; exit 1 ;;
          esac
          pass=$$(printf '%s' "$$2" | sed 's/["\\]/\\&/g')
          status=$$(scram POST "$$1" "$$pass" "$$users") || status=000
          if [ "$$status" = 500 ] && rpk security user list $$admin | grep -qx "$$1"; then
            status=$$(scram PUT "$$1" "$$pass" "$$users/$$1") || status=000
          fi
          case $$status in
            2??) ;;
            *) echo "redpanda-init: a Admin API recusou o usuário $$1 com status $$status" >&2; exit 1 ;;
          esac
        }
        create_user iam "$$KAFKA_IAM_PASSWORD"
        create_user tenancy "$$KAFKA_TENANCY_PASSWORD"
        create_user console "$$KAFKA_CONSOLE_PASSWORD"
        for user in iam tenancy console; do
          rpk security user list $$admin | grep -qw "$$user"
        done
        rpk cluster config set superusers '["console",""]' $$admin
        rpk topic create ${KAFKA_IAM_TOPIC:-iam.events} ${KAFKA_IAM_DLQ:-iam.events.dlq} ${KAFKA_TENANCY_TOPIC:-tenancy.events} ${KAFKA_TENANCY_DLQ:-tenancy.events.dlq} $$broker -p 1 -r 1 || true
        for topic in ${KAFKA_IAM_TOPIC:-iam.events} ${KAFKA_IAM_DLQ:-iam.events.dlq} ${KAFKA_TENANCY_TOPIC:-tenancy.events} ${KAFKA_TENANCY_DLQ:-tenancy.events.dlq}; do
          rpk topic describe "$$topic" $$broker >/dev/null
        done
        rpk security acl create --allow-principal User:iam --operation write,describe --topic ${KAFKA_IAM_TOPIC:-iam.events} --topic ${KAFKA_IAM_DLQ:-iam.events.dlq} $$broker
        rpk security acl create --allow-principal User:iam --operation read,describe --topic ${KAFKA_IAM_TOPIC:-iam.events} --group ${KAFKA_IAM_GROUP:-iam-membership} $$broker
        rpk security acl create --allow-principal User:tenancy --operation write,describe --topic ${KAFKA_TENANCY_TOPIC:-tenancy.events} --topic ${KAFKA_TENANCY_DLQ:-tenancy.events.dlq} $$broker
        rpk cluster config set kafka_enable_authorization true $$admin
    deploy:
      resources:
        limits: { cpus: '0.05', memory: 64M }
        reservations: { cpus: '0.01', memory: 16M }

# Servidor Postgres das apps. Cada app tem banco e role com o próprio nome
# (um por contexto), criados no postgres-init (profile dmpf);
# o schema, por `postgres.Migrate` (MIGRATE=true no papel api de cada
# contexto), não por init script. O usuário do container é só administrativo.
services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres, dmpf, all]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.56', memory: 640M }
        reservations: { cpus: '0.10', memory: 128M }

volumes:
  postgres-data:

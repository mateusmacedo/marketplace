# Sem shell na imagem, como o Loki: sem healthcheck por CMD. `user: root`
# porque o volume nomeado nasce do root e o Tempo escreve WAL e blocos nele.
services:
  tempo:
    image: grafana/tempo:3.0.0
    profiles: [tempo, observability, dmpf, all]
    command: ['-config.file=/etc/tempo/tempo.yaml']
    user: root
    stop_grace_period: 45s
    ports:
      - '127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200'
    volumes:
      - ../../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits: { cpus: '0.78624', memory: 1236M }
        reservations: { cpus: '0.10', memory: 128M }

volumes:
  tempo-data:

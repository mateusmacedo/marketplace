# Collector OTLP/gRPC: recebe a telemetria dos papéis (autoexport, por OTEL_*)
# e a encaminha ao Tempo (traces), ao Prometheus (métricas) e ao Loki (logs).
# A configuração é a mesma que os manifestos Kubernetes usam.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: [otel, observability, dmpf, all]
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      TAIL_SAMPLING_READ_PERCENTAGE: '100'
      TAIL_SAMPLING_UNCLASSIFIED_PERCENTAGE: '100'
      GOMEMLIMIT: 473MiB
    ports:
      - '127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTELCOL_METRICS_PORT:-8888}:8888'
    volumes:
      - ../../observability/otel-collector/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '0.78624', memory: 592M }
        reservations: { cpus: '0.05', memory: 64M }

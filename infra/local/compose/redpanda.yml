# Redpanda no mesmo modo do CI (ci.yml: --mode dev-container --smp 1). Dois
# listeners: `internal` para os containers do projeto (redpanda:29092), que
# exige SASL SCRAM — cada processo se autentica com o próprio principal
# (IDN-04) —, e `external` publicado no host em ${REDPANDA_PORT:-9092}, sem
# autenticação, que é o endereço que os testes locais dos módulos Go usam
# (KAFKA_BROKERS=localhost:9092). Só para desenvolvimento: outro
# container da rede também o alcança em redpanda:9092, e o principal dele é
# superusuário. Usuários, ACLs e autorização nascem no redpanda-init.
# A porta 9644 serve as métricas Prometheus nativas, que o scrape lê.
services:
  redpanda:
    image: redpandadata/redpanda:v26.2.2
    profiles: [redpanda, dmpf, all]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1280M
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:${REDPANDA_PORT:-9092}
      # Declarado só pelo kafka_api: o --kafka-addr descartaria o método de
      # autenticação de cada listener.
      - --set
      - 'redpanda.kafka_api=[{"name":"internal","address":"0.0.0.0","port":29092,"authentication_method":"sasl"},{"name":"external","address":"0.0.0.0","port":9092,"authentication_method":"none"}]'
    ports:
      - '127.0.0.1:${REDPANDA_PORT:-9092}:9092'
      - '127.0.0.1:${REDPANDA_ADMIN_PORT:-9644}:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster info -X brokers=localhost:9092 >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: '0.84', memory: 1920M }
        reservations: { cpus: '0.25', memory: 512M }

volumes:
  redpanda-data:

# Ambiente de desenvolvimento local: um recurso por arquivo em compose/, todos
# incluídos aqui. Suba por profile — `docker compose --profile postgres up -d`,
# `--profile observability` (Grafana, Loki, Tempo, Prometheus, Alloy e o
# Collector), `--profile dmpf` (os processos das apps com tudo o que eles
# precisam) ou `--profile all`. Valores sensíveis vêm de .env (ignorado pelo
# git; ver .env.example); os defaults servem apenas ao desenvolvimento local. O
# generator bounded-context inclui aqui o compose de cada app.

name: nx-base-template-local

include:
  - compose/postgres.yml
  - compose/redis.yml
  - compose/redpanda.yml
  - compose/pki.yml
  - compose/redpanda-console.yml
  - compose/floci.yml
  - compose/otel-collector.yml
  - compose/prometheus.yml
  - compose/exporters.yml
  - compose/loki.yml
  - compose/tempo.yml
  - compose/alloy.yml
  - compose/grafana.yml
  - compose/provisioning.generated.yml
  - compose/swagger-ui.yml

# Redpanda Console: interface do Kafka (tópicos, grupos, mensagens, schema) e da
# Admin API do broker. Endereços internos do projeto; a porta publicada no host
# fica no compose.
kafka:
  brokers: ['redpanda:29092']
  # O listener interno exige SASL; o console usa o próprio principal, criado no
  # redpanda-init com a senha padrão de desenvolvimento.
  sasl:
    enabled: true
    mechanism: SCRAM-SHA-256
    username: console
    password: console-local
redpanda:
  adminApi:
    enabled: true
    urls: ['http://redpanda:9644']
server:
  listenPort: 8080

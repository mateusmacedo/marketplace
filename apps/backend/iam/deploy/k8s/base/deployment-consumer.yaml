# O consumer é um membro do consumer group do canal iam.events: a réplica extra
# rebalanceia partições, e o canal de referência tem uma só.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-consumer
  labels:
    app.kubernetes.io/component: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: consumer
    spec:
      serviceAccountName: iam
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: ghcr.io/mateusmacedo/iam:latest
          args: ['--role', 'consumer']
          envFrom:
            - configMapRef:
                name: iam
            - secretRef:
                name: iam
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: $(OTEL_RESOURCE_ATTRIBUTES),service.instance.id=$(K8S_POD_NAME),dmpf.process.role=consumer
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      # O RebalanceTimeout do consumer é 30 s; a revogação cancela o trabalho
      # em curso antes disso.
      terminationGracePeriodSeconds: 35

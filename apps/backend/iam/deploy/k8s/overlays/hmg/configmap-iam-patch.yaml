apiVersion: v1
kind: ConfigMap
metadata:
  name: iam
data:
  # Kafka gerenciado com TLS (o default da app já é TLS ≥ 1.2; fica explícito) e
  # o gRPC do api com o certificado montado de iam-grpc-tls.
  KAFKA_INSECURE: 'false'
  GRPC_TLS_CERT_FILE: /etc/dmpf/grpc/tls.crt
  GRPC_TLS_KEY_FILE: /etc/dmpf/grpc/tls.key
  # mTLS (IDN-03): só o workload do BFF, assinado pela CA de clientes montada
  # de grpc-client-ca, é servido; e o principal Kafka se autentica por SASL
  # SCRAM com o usuário e a senha do Secret do contexto (IDN-04).
  GRPC_CLIENT_CA_FILE: /etc/dmpf/grpc-clients/ca.crt
  GRPC_TRUSTED_CLIENTS: spiffe://dmpf/bff
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  # Tenant reservado do marketplace, onde vivem os compradores.
  IAM_OPERATOR_TENANT: marketplace
  OTEL_RESOURCE_ATTRIBUTES: service.version=hmg,deployment.environment.name=hmg
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector:4317
  OTEL_EXPORTER_OTLP_CERTIFICATE: /etc/dmpf/otel/ca.crt

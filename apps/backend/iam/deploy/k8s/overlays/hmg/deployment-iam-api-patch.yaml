# A sonda gRPC do kubelet não fala TLS, então com o certificado ativo o api
# volta à sonda de socket; recursos de homologação e o certificado montado.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # O banco gerenciado nasce vazio (ADR-053 recria os bancos): o api
            # aplica o schema na partida, e postgres.Migrate é idempotente.
            - name: MIGRATE
              value: 'true'
          readinessProbe:
            grpc: null
            tcpSocket:
              port: grpc
          livenessProbe:
            grpc: null
            tcpSocket:
              port: grpc
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/dmpf/grpc
              readOnly: true
            - name: grpc-client-ca
              mountPath: /etc/dmpf/grpc-clients
              readOnly: true
            - name: otel-collector-ca
              mountPath: /etc/dmpf/otel
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: grpc-tls
          secret:
            secretName: iam-grpc-tls
        - name: grpc-client-ca
          secret:
            secretName: grpc-client-ca
        - name: otel-collector-ca
          secret:
            secretName: otel-collector-ca

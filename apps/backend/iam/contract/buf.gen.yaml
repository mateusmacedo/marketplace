version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mateusmacedo/marketplace/apps/backend/iam/contract/gen/go
plugins:
  # Pin do plugin (BUF-06): a versão precisa ser igual à de google.golang.org/protobuf
  # no go.mod deste módulo; o gate buf-pins confere.
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    out: gen/go
    opt: paths=source_relative
inputs:
  - directory: proto

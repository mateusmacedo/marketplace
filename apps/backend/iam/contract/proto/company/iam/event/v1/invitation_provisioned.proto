syntax = "proto3";

package company.iam.event.v1;

import "google/protobuf/timestamp.proto";

// Keycloak returned the subject of an invited e-mail, in the iam bounded
// context. Envelope type: com.company.iam.invitation-provisioned.v1 (PTB-03).
message InvitationProvisioned {
  string email = 1;
  string subject = 2;
  // Refs of roles, sorted and without repetition.
  repeated string roles = 3;
  google.protobuf.Timestamp provisioned_at = 4;
}

# O BFF é a única borda HTTP publicada no host (ADR-044 do platform); fala gRPC
# com mTLS com cada contexto e serve os OpenAPI embutidos na imagem. A API e o
# papel session-events verificam o token pelo Keycloak de referência: o ambiente
# sobe com `--profile dmpf --profile keycloak`. Sem o profile keycloak, a API não
# passa da descoberta OIDC e reinicia (on-failure).
x-image: &image
  build:
    context: ../../../..
    dockerfile: apps/backend/bff/Dockerfile
  image: ${BFF_IMAGE:-bff:local}

x-redis-url: &redis-url redis://revocation:${REDIS_REVOCATION_PASSWORD:-dmpf-local-revocation}@redis:6379/0

services:
  dmpf-bff:
    <<: *image
    extends:
      file: ../../../../infra/local/compose/app-base.yml
      service: dmpf-http-edge
    stop_grace_period: 30s
    environment:
      OTEL_SERVICE_NAME: bff
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=local,deployment.environment.name=local},service.instance.id=bff,dmpf.process.role=api
      HTTP_ADDR: ':8080'
      ADMIN_ADDR: ':8090'
      TENANCY_GRPC_TARGET: dns:///dmpf-tenancy-api:9090
      # O AUTH_DEV_MOCK fica só nas suítes de teste; aqui o token vem do
      # Keycloak, com o operador e o client marketplace-dev do seed do bff.
      OIDC_ISSUER: http://keycloak.localhost:${KEYCLOAK_PORT:-8180}/realms/dmpf
      OIDC_AUDIENCE: dmpf-bff
      OIDC_TENANT_CLAIM: organization.*.tenant_id
      OIDC_PERMISSION_CLAIMS: scope,realm_access.roles,organization.*.resource_access.marketplace-store.roles
      # Liga o POST /auth/token: troca a senha do operador por um token pelo
      # client marketplace-dev. Só em desenvolvimento, nunca no hmg.
      AUTH_TOKEN_CLIENT_ID: marketplace-dev
      # Sem GRPC_SERVER_NAME: cada alvo é verificado pelo próprio host.
      GRPC_CA_FILE: /pki/ca.crt
      GRPC_CLIENT_CERT_FILE: /pki/bff-client.crt
      GRPC_CLIENT_KEY_FILE: /pki/bff-client.key
      OPENAPI_TENANCY_PATH: /contracts/openapi/tenancy/v1/openapi.yaml
      # Só o Swagger UI local chama o BFF de outro origin; fora do
      # desenvolvimento a variável fica vazia e a borda é same-origin.
      CORS_ORIGINS: http://localhost:${SWAGGER_PORT:-8082},http://127.0.0.1:${SWAGGER_PORT:-8082}
      REDIS_URL: *redis-url
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:8080'
    depends_on:
      pki-init:
        condition: service_completed_successfully
      dmpf-tenancy-api:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
      # WHY: required false mantém válido o `--profile dmpf` sozinho, porque o
      # swagger-ui gerado depende deste serviço.
      bff-keycloak-seed:
        condition: service_completed_successfully
        required: false

  dmpf-bff-session-events:
    <<: *image
    extends:
      file: ../../../../infra/local/compose/app-base.yml
      service: dmpf-app
    profiles: !override [keycloak]
    command: ['session-events']
    stop_grace_period: 30s
    environment:
      OTEL_SERVICE_NAME: bff
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=local,deployment.environment.name=local},service.instance.id=bff-session-events,dmpf.process.role=session-events
      SESSION_EVENTS_ADDR: ':8091'
      ADMIN_ADDR: ':8092'
      OIDC_ISSUER: http://keycloak.localhost:${KEYCLOAK_PORT:-8180}/realms/dmpf
      OIDC_REVOCATION_TTL_SECONDS: '300'
      OIDC_BACKCHANNEL_CLIENT_ID: dmpf-portal
      OIDC_SESSION_EVENTS_CLIENT_ID: dmpf-session-events
      OIDC_SESSION_EVENTS_CLIENT_SECRET: ${KEYCLOAK_SESSION_EVENTS_SECRET:-dmpf-dev-session-events}
      REDIS_URL: *redis-url
      GOMEMLIMIT: 96MiB
    # A imagem declara o healthcheck da API, que exige a configuração dela.
    healthcheck:
      test: ['CMD', '/bff', 'session-events', 'healthcheck']
      interval: 5s
      timeout: 4s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.10', memory: 128M }
        reservations: { cpus: '0.02', memory: 32M }
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
        required: false

  # Seed complementar do realm dmpf (deploy/keycloak/seed.sh): o operador, o
  # comprador, a loja-demo com o dono, os clients do marketplace (o
  # marketplace-dev com o login do Swagger UI) e a service account do iam com o
  # FGAP v2. Roda depois do keycloak-init gerado e é idempotente.
  bff-keycloak-seed:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    profiles: [keycloak]
    entrypoint: ['bash', '/seed/seed.sh']
    environment:
      KEYCLOAK_URL: http://keycloak.localhost:${KEYCLOAK_PORT:-8180}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_SEED_PASSWORD: ${KEYCLOAK_SEED_PASSWORD:-dmpf-dev-password}
      KEYCLOAK_IAM_ADMIN_SECRET: ${KEYCLOAK_IAM_ADMIN_SECRET:-dmpf-dev-iam-admin}
      SWAGGER_PORT: ${SWAGGER_PORT:-8082}
    volumes:
      - ./keycloak/seed.sh:/seed/seed.sh:ro
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    restart: 'no'
    # WHY: cada kcadm.sh sobe uma JVM; com meia CPU, o seed num realm já
    # convergido passa de 4 min. Ele roda uma vez e sai.
    deploy:
      resources:
        limits: { cpus: '2', memory: 256M }
        reservations: { cpus: '0.05', memory: 64M }

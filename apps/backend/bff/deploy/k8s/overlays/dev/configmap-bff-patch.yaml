apiVersion: v1
kind: ConfigMap
metadata:
  name: bff
data:
  # Os `api` dos contextos rodam sem TLS em dev.
  GRPC_INSECURE: 'true'
  # O AUTH_DEV_MOCK fica só nas suítes de teste: a API e o session-events, que
  # leem este ConfigMap, verificam pelo Keycloak do Component infra/keycloak/dev,
  # no hostname que ele publica (KC_HOSTNAME). O operador e o client
  # marketplace-dev vêm do Job bff-keycloak-seed (deploy/keycloak).
  OIDC_ISSUER: http://keycloak:8080/realms/dmpf
  OIDC_AUDIENCE: dmpf-bff
  OIDC_TENANT_CLAIM: organization.*.tenant_id
  OTEL_RESOURCE_ATTRIBUTES: service.version=dev,deployment.environment.name=dev

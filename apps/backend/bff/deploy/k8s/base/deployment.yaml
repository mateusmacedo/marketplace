apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  labels:
    app.kubernetes.io/component: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bff
    spec:
      serviceAccountName: bff
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: ghcr.io/mateusmacedo/bff:latest
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: bff
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: $(OTEL_RESOURCE_ATTRIBUTES),service.instance.id=$(K8S_POD_NAME),dmpf.process.role=api
            - name: ADMIN_ADDR
              value: ':8090'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: url
          # A prontidão só cai no dreno do SIGTERM; a vivacidade olha só o
          # processo, para que uma dependência fora não reinicie a borda.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 30

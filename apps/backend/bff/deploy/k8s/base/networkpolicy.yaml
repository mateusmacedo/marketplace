# A borda autentica cada requisição no próprio processo, e a rede ainda limita
# quem chega até ela: só pods rotulados como cliente. matchExpressions evita que
# o Kustomize injete o label `name` desta base no seletor do peer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bff
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: dmpf/api-client
                operator: In
                values: ['true']
      ports:
        - port: http
          protocol: TCP

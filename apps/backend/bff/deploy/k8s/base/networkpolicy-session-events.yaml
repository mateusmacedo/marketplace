# Só o Keycloak entrega logout tokens ao receptor. matchExpressions evita que o
# Kustomize injete o label `name` desta base no seletor do peer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-session-events
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: session-events
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [keycloak]
      ports:
        - port: backchannel
          protocol: TCP

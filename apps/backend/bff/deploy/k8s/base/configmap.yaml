# Sem alvo gRPC enquanto não há contexto: cada contexto acrescenta o próprio
# alvo (o Service do `api` dele) e a política de transporte quando chega.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bff
data:
  HTTP_ADDR: ':8080'
  OTEL_SERVICE_NAME: bff
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_TRACES_SAMPLER_ARG: '1.0'
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PROPAGATORS: tracecontext
  OTEL_GO_X_OBSERVABILITY: 'true'
  OTEL_BSP_EXPORT_TIMEOUT: '3000'
  OTEL_BLRP_EXPORT_TIMEOUT: '3000'
  DRAIN_DELAY: '5s'
  # accessTokenLifespan do realm: a entrada da deny-list vive além do token
  # mais longo emitido antes do logout.
  OIDC_REVOCATION_TTL_SECONDS: '300'

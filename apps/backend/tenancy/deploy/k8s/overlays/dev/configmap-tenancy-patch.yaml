apiVersion: v1
kind: ConfigMap
metadata:
  name: tenancy
data:
  # O Redpanda da base roda sem TLS em dev, e o gRPC interno também.
  KAFKA_INSECURE: 'true'
  GRPC_INSECURE: 'true'
  # Tenant reservado do marketplace, onde vive o registro de lojas; só o api o lê.
  TENANCY_OPERATOR_TENANT: marketplace
  OTEL_RESOURCE_ATTRIBUTES: service.version=dev,deployment.environment.name=dev

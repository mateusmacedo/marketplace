# Só o BFF chama o contexto (RST-01: a borda pública é ele). O par permitido
# usa matchExpressions porque o Kustomize injeta o label `name` desta base em
# todo matchLabels de NetworkPolicy, o que exigiria o nome errado do peer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenancy-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [bff]
      ports:
        - port: 9090
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenancy-workers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: relay
  policyTypes: [Ingress]
  ingress: []

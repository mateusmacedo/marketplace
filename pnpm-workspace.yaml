packages:
  - "apps/*"
  - "libs/**"
  - "tools/*"
allowBuilds:
  "@biomejs/biome": true
  "@datadog/pprof": false
  "@nestjs/core": true
  "@newrelic/fn-inspect": false
  "@newrelic/native-metrics": false
  "@parcel/watcher": true
  "@scarf/scarf": false
  "@swc/core": true
  lefthook: true
  less: true
  nx: true
  protobufjs: false

  "@nestjs/testing": 11.1.28
  "@nx-go/nx-go": 4.0.0
  "@nx/angular": 23.1.0
  "@nx/docker": 23.1.0
  "@nx/express": 23.1.0
  "@nx/jest": 23.1.0
  "@nx/js": 23.1.0
  "@nx/nest": 23.1.0
  "@nx/next": 23.1.0
  "@nx/node": 23.1.0
  "@nx/react": 23.1.0
  "@nx/web": 23.1.0
  "@nx/webpack": 23.1.0
  "@nx/workspace": 23.1.0
  "@swc-node/register": 1.11.1
  "@swc/core": 1.15.40
